<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44" fill="none" role="img" aria-label="DERFEL">
  <style>
    @keyframes derfel-pulse {
      0%, 100% { opacity: 1; r: 1.7px; }
      50% { opacity: .45; r: 1.3px; }
    }
    .ink { stroke: #1A1A1A; }
    .core {
      fill: #4F7DF3;
      animation: derfel-pulse 2.4s ease-in-out infinite;
      transform-origin: 22px 22px;
    }
    @media (prefers-reduced-motion: reduce) {
      .core { animation: none; }
    }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #E8E8E5; }
      .core { fill: #7AA2F7; }
    }
  </style>
  <g class="ink" stroke-width="1.5" stroke-linecap="round">
    <path d="M12 12v20"></path>
    <path d="M34 12v20"></path>
    <path d="M22 7v12"></path>
    <path d="M22 25v12"></path>
    <path d="M22 14c3.31 0 6 3.58 6 8s-2.69 8-6 8"></path>
  </g>
  <circle class="core" cx="22" cy="22" r="1.7"></circle>
</svg>
