<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <style>
    .brand {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font-size: 64px;
      letter-spacing: 2px;
      fill: #1E2327; /* тъмносиво */
    }
    .highlight {
      fill: #F05340; /* оранжево */
    }
    .tagline {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #808080; /* светлосиво */
    }
  </style>

  <!-- Икона -->
  <circle cx="50" cy="60" r="30" stroke="#F05340" stroke-width="6" fill="none"/>
  <circle cx="80" cy="40" r="6" fill="#F05340"/>

  <!-- Текст -->
  <text x="120" y="70" class="brand">
    DER<tspan class="highlight">F</tspan>EL
  </text>

  <!-- Подзаглавие -->
  <text x="120" y="100" class="tagline">
    Open Source • Innovation • Efficiency
  </text>
</svg>